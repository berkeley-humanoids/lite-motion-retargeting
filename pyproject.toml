[project]
name = "lite-motion-retargeting"
version = "0.1.0"
description = "Motion capture sets retargeted from the Unitree G1 to the Berkeley Lite humanoid."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.24",
    "mink>=0.0.7",
    "mujoco>=3.2",
    "numpy>=1.26",
    # Kimodo ships LeRobot parquet shards, and the site reads Rerun chunks as Arrow.
    "pyarrow>=18",
    "rerun-sdk>=0.38.1",
    "lite-description @ git+https://github.com/Berkeley-Humanoids/Lite-Description.git",
    # Slerp, for the resample of the base rotation onto the output rate.
    "scipy>=1.11",
    "tqdm>=4.66",
    "tyro>=0.9",
]

[project.optional-dependencies]
# ReActor trains in MuJoCo Warp. mjlab pins MuJoCo, which the IK then runs on too.
reactor = ["mjlab>=1.6"]

[project.scripts]
download = "lite_motion_retargeting.scripts.download:main"
retarget = "lite_motion_retargeting.scripts.retarget:main"
reactor = "lite_motion_retargeting.scripts.reactor:main"
compare = "lite_motion_retargeting.scripts.compare:main"
build-site = "lite_motion_retargeting.scripts.build_site:main"
serve = "lite_motion_retargeting.scripts.serve:main"
publish = "lite_motion_retargeting.scripts.publish:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# lite-description installs from GitHub, not from PyPI.
allow-direct-references = true
