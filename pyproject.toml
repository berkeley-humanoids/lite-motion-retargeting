[project]
name = "lite-motion-retargeting"
version = "0.1.0"
description = "LAFAN1 motions retargeted from the Unitree G1 to the Berkeley Lite humanoid."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.24",
    "mink>=0.0.7",
    "mujoco>=3.2",
    "numpy>=1.26",
    "pyarrow>=17",
    # A motion is a Rerun .rrd file. See scripts/rrd.py.
    "rerun-sdk>=0.36",
    # The same asset package and pin as Lite-Motion-Tracking, so both read one MJCF.
    "robot-assets @ git+https://github.com/Berkeley-Humanoids/Lite-Description.git",
    "tqdm>=4.66",
    "tyro>=0.9",
    "viser>=0.2.10",
]
